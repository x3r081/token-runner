name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          GODOT_VERSION=4.7.2
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot

      - name: Generate assets
        run: |
          godot --headless --path . --script scripts/tools/run_generate.gd
          godot --headless --path . --import

      - name: Run smoke tests
        run: godot --headless --path . --scene tests/smoke_test.tscn

      - name: Run soft-lock regression test
        run: godot --headless --path . --scene tests/soft_lock_test.tscn

      - name: Run storyline/quest regression test
        run: godot --headless --path . --scene tests/story_test.tscn

      - name: Run combat regression test
        run: godot --headless --path . --scene tests/combat_test.tscn

      - name: Run technical-debt regression test
        run: godot --headless --path . --scene tests/debt_test.tscn

      - name: Run ship-before-reset cycle regression test
        run: godot --headless --path . --scene tests/cycle_test.tscn

      - name: Run region-build regression test
        run: godot --headless --path . --scene tests/region_test.tscn

      - name: Validate project loads
        run: godot --headless --path . --quit-after 1

  export:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot export templates
        run: |
          GODOT_VERSION=4.7.2
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Generate assets
        run: |
          godot --headless --path . --script scripts/tools/run_generate.gd
          godot --headless --path . --import

      - name: Export Linux build
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Linux" build/token-runner-linux.x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: token-runner-linux
          path: build/token-runner-linux.x86_64
