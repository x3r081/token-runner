name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          GODOT_VERSION=4.7.2
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot

      - name: Generate assets
        run: |
          godot --headless --path . --script scripts/tools/run_generate.gd
          godot --headless --path . --import

      - name: Run smoke tests
        run: godot --headless --path . --scene tests/smoke_test.tscn

      - name: Run soft-lock regression test
        run: godot --headless --path . --scene tests/soft_lock_test.tscn

      - name: Run storyline/quest regression test
        run: godot --headless --path . --scene tests/story_test.tscn

      - name: Run combat regression test
        run: godot --headless --path . --scene tests/combat_test.tscn

      - name: Run technical-debt regression test
        run: godot --headless --path . --scene tests/debt_test.tscn

      - name: Run ship-before-reset cycle regression test
        run: godot --headless --path . --scene tests/cycle_test.tscn

      - name: Run region-build regression test
        run: godot --headless --path . --scene tests/region_test.tscn

      - name: Run model-selection regression test
        run: godot --headless --path . --scene tests/model_test.tscn

      - name: Run deployable-agent regression test
        run: godot --headless --path . --scene tests/agent_test.tscn

      - name: Run architecture-decisions regression test
        run: godot --headless --path . --scene tests/architecture_test.tscn

      - name: Run Claude dialogue/callback regression test
        run: godot --headless --path . --scene tests/dialogue_test.tscn

      - name: Run production-incident (IT WAS DNS) regression test
        run: godot --headless --path . --scene tests/production_test.tscn

      - name: Run audio-safety regression test
        run: godot --headless --path . --scene tests/audio_test.tscn

      - name: Run boss behaviour regression test
        run: godot --headless --path . --scene tests/boss_test.tscn

      - name: Run branching debug-quest regression test
        run: godot --headless --path . --scene tests/debug_quest_test.tscn

      - name: Run ship-results roast regression test
        run: godot --headless --path . --scene tests/results_test.tscn

      - name: Run intro soft-lock regression test
        run: godot --headless --path . --scene tests/opening_test.tscn

      - name: Run progression (region unlock/travel) regression test
        run: godot --headless --path . --scene tests/progression_test.tscn

      - name: Run win-condition completability regression test
        run: godot --headless --path . --scene tests/win_test.tscn

      - name: Run UI overlay (screen-space) regression test
        run: godot --headless --path . --scene tests/ui_overlay_test.tscn

      - name: Run world-map fast-travel regression test
        run: godot --headless --path . --scene tests/map_travel_test.tscn

      - name: Run death/respawn regression test
        run: godot --headless --path . --scene tests/death_respawn_test.tscn

      - name: Validate project loads
        run: godot --headless --path . --quit-after 1

  export:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot export templates
        run: |
          GODOT_VERSION=4.7.2
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Generate assets
        run: |
          godot --headless --path . --script scripts/tools/run_generate.gd
          godot --headless --path . --import

      - name: Export Linux build
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Linux" build/token-runner-linux.x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: token-runner-linux
          path: build/token-runner-linux.x86_64
